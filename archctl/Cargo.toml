[package]
name = "archctl"
version = "0.1.0"
edition = "2024"
description = "Sidecar CLI for OpenCode Architecture Diagrammer. Implements M1 (skillset reproducible) of docs/ROADMAP.md."
license = "MIT"
publish = false

[lib]
name = "archctl"
path = "src/lib.rs"

[[bin]]
name = "archctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
toml = "0.8"
cargo_metadata = "0.23"
gix = "0.86"
hex = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
ast-grep-core = { version = "0.45", features = ["tree-sitter"] }
ast-grep-language = { version = "0.45.0", features = ["builtin-parser"] }
basemind-tree-sitter-graph = "0.12"
ignore = "0.4"
lbug = "0.18.3"
tree-sitter = "0.26"
jsonschema = { version = "0.49.2", default-features = false }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = "1"
