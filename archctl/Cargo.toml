[package]
name = "archctl"
version = "1.38.1"
edition = "2024"
# MSRV = consumer compile floor, validated empirically at apply: the current
# dependency tree requires rustc 1.91 (cargo-platform@0.3.3) and 1.86-1.88
# elsewhere (idna_adapter, ignore, time). Spec proposed 1.85 but deps demand
# more; proposal risk table authorized "raise in its own commit" (see ADR-025).
# CI runs above MSRV on the exact pin 1.97.1 (root rust-toolchain.toml).
rust-version = "1.91"
description = "Sidecar CLI for OpenCode Architecture Diagrammer. Implements M1 (skillset reproducible) of docs/ROADMAP.md."
license = "MIT"
publish = false

[lib]
name = "archctl"
path = "src/lib.rs"

[[bin]]
name = "archctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
toml = "0.8"
cargo_metadata = "0.23"
gix = "0.86"
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
ast-grep-core = { version = "0.45", features = ["tree-sitter"] }
ast-grep-language = { version = "0.45.0", features = ["builtin-parser"] }
ignore = "0.4"
fs2 = "0.4"
lbug = "0.18.3"
tree-sitter = "0.26"
jsonschema = { version = "0.49.2", default-features = false }
petgraph = { version = "0.6", default-features = false }
svg = { version = "0.14", default-features = false }
# Mermaid renderer — pure Rust, no graphviz/network. Pinned to 0.8.0-alpha.3.
merman-core = "=0.8.0-alpha.3"
merman-render = "=0.8.0-alpha.3"
# NOTE: M40 explored `plantuml-little = "1.2026.2-4"` as a pure-Rust PlantUML
# renderer. The crate hard-links against `graphviz-anywhere` at compile time
# (required for use case / state / class layout), which conflicts with ADR-011
# (local-only, no graphviz binary vendored). PlantUML rendering is therefore
# delegated to a user-provided backend (Java PlantUML CLI / docker) — see
# `archctl/src/render/plantuml.rs` and docs/specs/plantuml-render.md.
rust-embed = { version = "8", features = ["include-flate"] }
tiny_http = "0.12"
percent-encoding = "2"
# M71: atomic writes for workspace state persistence (ADR-041)
tempfile = "3"
# M73: versioned distribution — semver parsing for install_dir paths.
semver = "1"
# M73: self-update via GitHub Releases.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
# Tree-sitter language crates for characterization tests (M34 cycle).
# These mirror the languages supported by `archctl code call-graph`.
# Production code uses `ast_grep_language::SupportLang`, which transitively
# re-exports these; the dev-deps here are for direct parsing in tests.
tree-sitter-go = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-sg = "0.4"

[[bench]]
name = "export_pipeline"
harness = false

[[bench]]
name = "apply_pipeline"
harness = false

[[bench]]
name = "query_pipeline"
harness = false

[[bench]]
name = "class_diagram_pipeline"
harness = false

[[bench]]
name = "call_graph_apply"
harness = false
