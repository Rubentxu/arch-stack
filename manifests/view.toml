# scope: view
#
# Embedded archview workbench server (ADR-033). One-shot HTTP server on
# 127.0.0.1 serving the archview static bundle embedded via rust-embed,
# plus a read-only API (/api/health, /api/export) connecting the
# workbench to the LadybugDB graph.
#
# Extended in M71 (ADR-041) with workspace state persistence API:
# GET/PUT /api/workspace, GET /api/source, POST /api/open-editor.
#
# Invariants: bind ONLY 127.0.0.1 (ADR-011), COOP/COEP headers for
# SharedArrayBuffer (ADR-020), no daemon (ADR-010), no public network.

id = "view"
version = "0.2.0"
description = "Embedded archview workbench server (one-shot, 127.0.0.1 only)"
cargo_dir = "archctl"

editable = [
  "archctl/src/view.rs",
  "archctl/src/view/workspace.rs",
  "archctl/src/view/source.rs",
  "archctl/src/view/editor.rs",
]

public_symbols = [
  "handle_request",
  "run",
  "ViewOptions",
  "ServerInfo",
  "parse_port",
  "looks_like_project_dir",
  # M71 workspace state API
  "WorkspaceState",
  "Workspace",
  "validate_path_under_cwd",
  "SourcePreview",
  "MAX_LINES",
  "EditorCommand",
  "resolve_editor",
  "spawn_editor",
]

must_hold = [
  "127.0.0.1",
  "Cross-Origin-Opener-Policy",
  "Cross-Origin-Embedder-Policy",
  "Cross-Origin-Resource-Policy",
  "tiny_http",
  "rust_embed",
  "api/health",
  "api/export",
  # M71 endpoints
  "api/workspace",
  "api/source",
  "api/open-editor",
  # M71 atomic write
  "tempfile",
]

minimum_tests = 18

must_not_contain = [
  "0.0.0.0",
  "reqwest",
  "tokio::",
  "hyper",
  "async fn",
]
