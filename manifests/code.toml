# scope: code
#
# code::c4_discover is the C4 Container boundary inference engine.
# Four strategies (CargoWorkspace, NpmWorkspace, DockerfilePerService,
# HelmCharts) detect container boundaries; discover() merges them;
# apply() persists the results to the graph.

