# scope: project
#
# Project resolution: source identity (git vs directory) ->
# portable_project_id -> project_dir (XDG_DATA_HOME/archctl/projects/<id>).
# The single entry point is `resolve_project(cwd)` which returns a
# fully-populated `ProjectInfo`.

id = "project"
version = "0.1.0"
description = "Project resolution: source identity → project_id → project_dir"

cargo_dir = "archctl"

editable = ["archctl/src/project.rs"]

public_symbols = [
  "ProjectInfo",
  "resolve_project",
]

must_hold = [
  "pub struct ProjectInfo",
  "pub fn resolve_project(",
  "resolve_source_identity",
  "portable_project_id",
  "projects_root",
  "source_identity_summary",
]

minimum_tests = 0

must_not_contain = ["use std::fs::"]
