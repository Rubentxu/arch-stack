# scope: doctor
#
# Project diagnostics: XDG layout, source identity, renderers
# (Structurizr + PlantUML), required binaries (opencode, archctl).
# The doctor command also runs the scope gates (check_scope) so
# `archctl doctor --check-scope` is the canonical pre-commit gate.

id = "doctor"
version = "0.1.0"
description = "Project diagnostics (XDG, identity, renderers, binaries) + scope gates"

cargo_dir = "archctl"

editable = ["archctl/src/doctor.rs"]

public_symbols = [
  "Finding",
  "Severity",
  "Ok",
  "Warn",
  "Fail",
  "run",
  "check_scope",
]

must_hold = [
  "pub struct Finding",
  "pub enum Severity",
  "pub fn run(",
  "pub fn check_scope(",
  "create_dir_all",
  "resolve_source_identity",
  "check_all_scopes",
]

minimum_tests = 0

must_not_contain = ["use std::fs::"]
