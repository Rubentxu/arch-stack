# scope: doctor
#
# Project diagnostics: XDG layout, source identity, renderers
# (Structurizr + PlantUML), required binaries (opencode, archctl).
# The doctor command also runs the scope gates (check_scope) so
# `archctl doctor --check-scope` is the canonical pre-commit gate.

id = "doctor"
version = "0.1.0"
description = "Project diagnostics (XDG, identity, renderers, binaries) + scope gates"

cargo_dir = "archctl"

editable = [
  "archctl/src/doctor/",
  "archctl/src/doctor/mod.rs",
  "archctl/src/doctor/storage.rs",
  "archctl/src/doctor/manifest.rs",
  "archctl/src/doctor/runner.rs",
]

public_symbols = [
  "Finding",
  "Severity",
  "DoctorScope",
  "run",
  "check_scope",
  "run_scope",
  "validate_manifests",
  "LbugStorageProbe",
  "run_smoke_gate",
  "run_all_smoke_gates",
]

must_hold = [
  "pub struct Finding",
  "pub enum Severity",
  "pub fn run(",
  "pub fn check_scope(",
  "create_dir_all",
  "resolve_source_identity",
  "check_all_scopes",
]

minimum_tests = 3

must_not_contain = [
  "use std::fs::",
  # doctor/storage.rs is the lbug adapter; other doctor modules
  # should remain adapter-agnostic
  "lbug::Connection",
  # Boundary: concrete lbug/store types that leak the internal
  # implementation. open_default is the port factory (returns
  # Box<dyn GraphStore>) — that is the public API, not a leak.
  "use crate::graph::Session",
  "use crate::store::LbugStore",
]
