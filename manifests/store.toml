# scope: store
#
# store is the hexagonal adapter that owns Cypher generation and
# graph persistence. Breaking its public surface makes every
# adapter (LbugStore today, SparrowStore tomorrow, dead-store
# when persistence is off) silently fall out of the graph.

id = "store"
version = "0.1.0"
description = "GraphStore hexagonal port + LbugStore adapter (B1 persistence)"

cargo_dir = "archctl"

editable = ["archctl/src/store.rs"]

# Public surface area. If any of these disappear, `archctl graph`
# subcommands and adapters break.
# Note: `put_source`, `put_evaluation`, `link_extracted_from` are
# GraphStore trait methods (declared as `fn <name>` without `pub`
# prefix per Rust idiom); they are tracked in `must_hold` below
# because the public_symbols regex requires the `pub` prefix.
# `SourceArtifact` and `Evaluation` live in `source.rs`/`evaluation.rs`
# with their own manifests.
public_symbols = [
  "GraphStore",
  "LbugStore",
  "UnitOfWork",
  "Transaction",
  "ElementRepository",
  "EvidenceRepository",
  "SourceRepository",
  "EvaluationRepository",
  "DiagramRepository",
  "SnapshotRepository",
  "RawGraphQuery",
  "open_default",
  "StoreError",
  "Snapshot",
]

# What `store` must keep doing, proved by a literal line in source.
# Each invariant is a contract assertion in code that has to
# remain present.
must_hold = [
  "pub trait GraphStore",
  "pub struct LbugStore",
  "pub trait UnitOfWork",
  "pub struct Transaction",
  "pub trait ElementRepository",
  "pub trait EvidenceRepository",
  "pub trait SourceRepository",
  "pub trait EvaluationRepository",
  "pub trait DiagramRepository",
  "pub trait SnapshotRepository",
  "pub struct Snapshot",
  "pub trait RawGraphQuery",
  "fn put_evidence",
  "fn put_source",
  "fn put_evaluation",
  "fn link_extracted_from",
  "fn accept_evidence",
  "fn supersede_evidence",
  "fn list_evidence_by_status",
  "fn upsert_element",
  "fn upsert_element_version",
  "fn list_elements",
  "fn list_semantic_edges",
  "pub trait SemanticEdgeRepository",
  "fn link_semantic_edge",
  "fn link_call_edge_with_resolution",
  "fn list_evidence_for_versions",
  "fn list_version_props",
  "fn put_fused_claims",
  "fn read_fused_claim_rows",
  "fn list_fused_conflict_edges",
  "fn query(",
  "is_read_only_query",
  "fn execute_raw_cypher_for_test",
  "open_default",
  "Box<dyn GraphStore>",
  "fn begin_transaction",
  "fn commit_transaction",
  "fn rollback_transaction",
  "pub fn commit",
  "pub fn rollback",
  "impl<'a> Drop for Transaction<'a>",
  "pub enum StoreError",
  # TRUST-005 (cycle p-38e02210a9f14317/trust-005-observation-fusion):
  # FeedbackRepository trait (next to EvidenceRepository at L50).
  "pub trait FeedbackRepository",
  "fn put_feedback",
  "fn read_feedback_for_claim",
  "fn list_reconciliations",
]

# Minimum tests for store.rs. We currently have 7.
minimum_tests = 13
