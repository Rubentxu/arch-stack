# scope: store
#
# store is the hexagonal adapter that owns Cypher generation and
# graph persistence. Breaking its public surface makes every
# adapter (LbugStore today, SparrowStore tomorrow, dead-store
# when persistence is off) silently fall out of the graph.

id = "store"
version = "0.1.0"
description = "GraphStore hexagonal port + LbugStore adapter (B1 persistence)"

cargo_dir = "archctl"

editable = ["archctl/src/store.rs"]

# Public surface area. If any of these disappear, `archctl graph`
# subcommands and adapters break.
# Note: `put_source`, `put_evaluation`, `link_extracted_from` are
# GraphStore trait methods (declared as `fn <name>` without `pub`
# prefix per Rust idiom); they are tracked in `must_hold` below
# because the public_symbols regex requires the `pub` prefix.
# `SourceArtifact` and `Evaluation` live in `source.rs`/`evaluation.rs`
# with their own manifests.
public_symbols = [
  "GraphStore",
  "LbugStore",
  "open_default",
]

# What `store` must keep doing, proved by a literal line in source.
# Each invariant is a contract assertion in code that has to
# remain present.
must_hold = [
  "pub trait GraphStore",
  "pub struct LbugStore",
  "fn put_evidence",
  "fn put_source",
  "fn put_evaluation",
  "fn link_extracted_from",
  "fn accept_evidence",
  "fn supersede_evidence",
  "fn list_evidence_by_status",
  "fn query(",
  "open_default",
  "Box<dyn GraphStore>",
]

# Minimum tests for store.rs. We currently have 7.
minimum_tests = 13
