# scope: architecture
#
# architecture::snapshot provides the snapshot management bounded
# context for archctl. It exposes create/list/gc/diff use cases that
# consume SnapshotRepository through the GraphStore port.

id = "architecture"
version = "0.1.0"
description = "Architecture snapshot management bounded context (T2.1)"

cargo_dir = "archctl"

editable = [
    "archctl/src/architecture/mod.rs",
    "archctl/src/architecture/errors.rs",
    "archctl/src/architecture/snapshot.rs",
    "archctl/src/architecture/digest.rs",
    "archctl/src/architecture/diff.rs",
    "archctl/src/architecture/explain.rs",
    "archctl/src/architecture/coverage.rs",
]

# Public symbols that consumers depend on.
public_symbols = [
    "create",
    "list",
    "gc",
    "diff_snapshots",
    "ArchitectureDiffReport",
    "DiffError",
    "SnapshotError",
    "SnapshotGcReport",
    "extractor_set_digest",
    "explain",
    "ExplainReport",
    "ExplainError",
    "ExplainSubject",
    "ExplainProvenance",
    "coverage",
    "CoverageReport",
    "CoverageError",
]

# Textual invariants that prove the module does what its scope declares.
must_hold = [
    "pub fn create(",
    "pub fn list(",
    "pub fn gc(",
    "pub fn diff_snapshots(",
    "pub enum DiffError",
    "pub struct ArchitectureDiffReport",
    "pub enum SnapshotError",
    "pub struct SnapshotGcReport",
    "pub fn extractor_set_digest(",
    "UnitOfWork::begin_transaction",
    "pub fn explain(",
    "pub struct ExplainReport",
    "pub enum ExplainError",
    "pub struct ExplainSubject",
    "pub struct ExplainProvenance",
    "pub fn coverage(",
    "pub struct CoverageReport",
    "pub enum CoverageError",
]

# Minimum number of #[test] items in the architecture module.
minimum_tests = 1

must_not_contain = ["use crate::store::LbugStore"]
