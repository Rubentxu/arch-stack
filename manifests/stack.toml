# scope: stack
#
# arch-stack product management (ADR-033). Installs/updates/reports the
# embedded skills+agents+plugin into OpenCode/ZCode discovery paths.
# One product: binary + workbench + skills versioned together.

id = "stack"
version = "0.1.0"
description = "arch-stack product management — install/update/status of embedded skills+agents"
cargo_dir = "archctl"

editable = [
  "archctl/src/stack.rs",
]

public_symbols = [
  "install",
  "status",
  "print_status",
  "default_install_root",
  "StackStatus",
]

must_hold = [
  "assets-stack",
  "skills/",
  "agents/",
  "default_install_root",
  "stack install",
  "drift",
  "idempotent",
]

minimum_tests = 4

must_not_contain = [
  "reqwest",
  "tokio::",
  "hyper",
  "async fn",
]
