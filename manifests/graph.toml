# scope: graph
#
# Domain types (Element, ElementVersion, StructuralEvidence, GraphStat,
# ElementRow, SemanticEdgeRow, VersionPropsRow) plus the admin boundary
# (init / stat / query / neighbours). The lbug session lifetime trick
# and the Cypher generation helpers (create_db_session, value_to_json,
# escape_cypher_string, count_match, run_query, link_with_merge_fallback)
# have moved into the LbugStore adapter in store.rs (P1-03).
#
# Bounded buffer pool (256 MiB per database) keeps the per-fixture
# footprint bounded — lbug 0.18.3's `SystemConfig::default()` resolves
# to UINT64_MAX which exhausts the kernel under parallel test fixtures.
# Refs: fix-parallel-lbug-test-races.

id = "graph"
version = "0.1.0"
description = "Domain types + admin boundary; lbug adapter lives in store.rs"

cargo_dir = "archctl"

editable = ["archctl/src/graph.rs"]

public_symbols = [
  "BUFFER_POOL_SIZE",
  "GraphStat",
  "Element",
  "ElementVersion",
  "StructuralEvidence",
  "ElementRow",
  "SemanticEdgeRow",
  "VersionPropsRow",
  "database_path",
  "init",
  "stat",
  "query",
  "neighbours",
  "validate_identifier",
]

must_hold = [
  "pub const BUFFER_POOL_SIZE",
  "pub struct GraphStat",
  "pub struct Element",
  "pub struct ElementVersion",
  "pub struct StructuralEvidence",
  "pub fn database_path(",
  "pub fn init(",
  "pub fn stat(",
  "buffer_pool_size",
]

minimum_tests = 8

must_not_contain = ["use std::fs::", "use lbug"]