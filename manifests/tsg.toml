# scope: tsg
#
# tsg::execute + tsg::extract_with_rules are the TSG (tree-sitter-
# graph) backend of the evidence pipeline. They translate .tsg
# rules into Evidence records. The rules live in
# `archctl/grammars/*.tsg` and are versioned artifacts, so the
# `must_hold` gate asserts that the in-tree grammars are still
# wired up.

id = "tsg"
version = "0.1.0"
description = "TSG (tree-sitter-graph) declarative extraction backend"

cargo_dir = "archctl"

editable = ["archctl/src/tsg.rs"]

public_symbols = [
  "TsgOutput",
  "load_rules",
  "execute",
  "extract_with_rules",
]

must_hold = [
  "pub fn execute(",
  "pub fn extract_with_rules(",
  "pub struct TsgOutput",
  "fn load_rules(",
  "SupportLang::",
  "TsgFile",
]

minimum_tests = 1
