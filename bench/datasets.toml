# archctl-bench datasets
#
# Each entry declares a pinned git SHA, language, extractor, and timeout.
# Used by bench/datasets.sh to clone and by bench/run-bench.sh to drive
# each extractor run.
#
# Referenced from: docs/specs/bench-harness.md (Requirement: Datasets)
# Methodology:      docs/adr/ADR-032-bench-methodology.md

# Default timeout (seconds) when a dataset does not override.
default_timeout = 60

# Default cache directory for cloned repos.
cache_dir = "~/.cache/archctl-smoke"

# Dataset declaration: [[datasets]] entry.
# Fields:
#   name       — "<owner>/<repo>" (used as clone path)
#   sha        — pinned full commit SHA (do NOT use branch names; SHA pins
#                the dataset to a reproducible version)
#   language   — "rust" | "typescript" | "javascript" | "go" | "python" |
#                "java" | "kotlin"
#   extractor  — archctl command to run (e.g. "code c4-discover --apply")
#   timeout    — seconds (overrides default_timeout)
#   notes      — rationale, expectations (free text)

[[datasets]]
name = "tokio-rs/axum"
sha = "c9a911b7999de50e9e5023942ca072e9725ae943"
language = "rust"
extractor = "code c4-discover --apply"
timeout = 60
notes = "6MB cargo workspace. Predecessor: ADR-031 found 6 bugs here (fixed in v0.14.10)."

