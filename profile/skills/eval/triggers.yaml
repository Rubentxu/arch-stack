  should_trigger:
    - "discover"
    - "scan"
    - "map the architecture"
    - "explain the codebase"
    - "starting work on a repo"
    - "after a refactor"
  should_not_trigger:
    - "class diagram"
    - "sequence diagram"
    - "review this diagram"
    - "install archctl"
    - "serve the workbench"

