name: CI

# Post-merge detection only (ADR-025): CI runs exclusively when a push
# updates main. Pre-merge fast checks live in pr.yml (ADR-047).
# Feature branches are also verified locally via scripts/verify-local.sh
# (pre-push hook). No pull_request trigger here — benchmarks are
# post-merge evidence, not PR gates.
on:
  push:
    branches: [main]

jobs:
  rust:
    name: archctl (build/test/clippy/fmt/doctor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archctl
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archctl/target
          key: cargo-${{ runner.os }}-${{ hashFiles('archctl/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Toolchain pinned exactly in root rust-toolchain.toml (1.97.1);
      # rustup materializes it from the pin. No floating stable install.
      - name: Resolve pinned toolchain
        run: rustup show active-toolchain

      - name: Build
        run: cargo build --quiet

      - name: Test
        run: cargo test --quiet

      - name: Clippy
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Doctor (repo-root cwd)
        run: |
          cargo build --quiet --release
          ./target/release/archctl doctor --scopes code --cwd ..

  version-sync:
    name: Version sync guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archctl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Cargo version
        id: cargo_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "cargo_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest git tag
        id: git_tag
        run: |
          # Latest tag by creatordate; strip leading v AND any pre-release/build
          # suffix so v0.14.0-rc1 compares as 0.14.0 (spec: guard strips suffix).
          TAG=$(git tag --sort=-creatordate | head -1 | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "git_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check version match
        run: |
          if [ "${{ steps.cargo_version.outputs.cargo_version }}" != "${{ steps.git_tag.outputs.git_tag }}" ]; then
            echo "ERROR: CARGO_PKG_VERSION (${{ steps.cargo_version.outputs.cargo_version }}) != latest git tag (${{ steps.git_tag.outputs.git_tag }})"
            exit 1
          fi

  bench-smoke:
    name: archctl (benchmark smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archctl
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archctl/target
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('archctl/Cargo.lock') }}
          restore-keys: cargo-bench-${{ runner.os }}-

      - name: Resolve pinned toolchain
        run: rustup show active-toolchain

      # ADR-019: benchmark smoke gate (deterministic, quick mode).
      - name: Benchmark smoke (export pipeline)
        run: cargo bench --bench export_pipeline -- --quick

  bench-compare:
    name: archctl (bench regression >10% vs previous main)
    runs-on: ubuntu-latest
    # Post-merge: compares merged HEAD against the previous main SHA
    # (github.event.before). Zero-SHA and unreachable baselines are
    # rejected inside scripts/bench-compare.sh (exit 2).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archctl/target
          key: cargo-benchcompare-${{ runner.os }}-${{ hashFiles('archctl/Cargo.lock') }}
          restore-keys: cargo-benchcompare-${{ runner.os }}-

      - name: Resolve pinned toolchain
        run: rustup show active-toolchain

      # ADR-019 enforcement post-merge: fail when any benchmark degrades
      # >10% vs the previous main commit.
      - name: Benchmark regression compare (vs previous main)
        run: scripts/bench-compare.sh "${{ github.event.before }}"

  web:
    name: archview (test/build/bundle-cap)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archview
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: archview/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      # ADR-019 hard contract: gzipped JS bundle <= 2MB. Single-source rule
      # in scripts/check-bundle-cap.sh, shared with scripts/verify-local.sh.
      - name: Bundle size check (gzipped <= 2MB)
        run: ../scripts/check-bundle-cap.sh "dist/assets/*.js"
