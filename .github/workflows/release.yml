name: release

# Trigger on every version tag push. The workflow:
# 1. Builds the archctl binary on each target in the matrix.
# 2. Generates SHA256SUMS + migration-manifest.json.
# 3. Creates/updates the GitHub Release with the binary tarballs.
#
# To cut a release:
#   git tag v1.X.Y && git push origin v1.X.Y
#
# Per ADR-040 (versioned distribution) + ADR-041 (self-update via GitHub Releases).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.38.0). Defaults to the latest pushed tag."
        required: false
        type: string

permissions:
  contents: write   # to create releases
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # build_matrix: build archctl on each (target, os) combination.
  # ---------------------------------------------------------------------------
  build_matrix:
    name: build ${{ matrix.label }}
    # Native runners per target (P0-03): darwin binaries MUST be built on
    # macOS (no cross toolchain for the lbug C++ FFI), aarch64 on ARM.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — primary target, Tier 1 per ADR-040.
          - label: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
            archive: tar.gz
          # Linux aarch64 — Tier 1 (Graviton, Asahi). Native ARM runner.
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            archive: tar.gz
          # macOS Intel — Tier 1 (Apple Silicon emulator support).
          - label: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            os: macos
            archive: tar.gz
          # macOS Apple Silicon — Tier 1.
          - label: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            os: macos
            archive: tar.gz
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Bootstrap rust-embed assets (ADR-033): archctl/assets-stack/ is
      # gitignored; the crate cannot compile without it.
      - name: Bootstrap assets-stack
        run: scripts/embed-stack.sh

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: archctl -> Cargo.toml

      - name: Build archctl release binary
        working-directory: archctl
        run: |
          cargo build --release --target ${{ matrix.target }} --bin archctl
          ls -lh target/${{ matrix.target }}/release/archctl

      - name: Run storage compatibility probe (ADR-048 Tier-1 gate)
        working-directory: archctl
        run: |
          set -euo pipefail
          # Create a temp project dir for the probe
          TMP=$(mktemp -d)
          mkdir -p "$TMP/probe-test"
          # Run the storage probe in JSON mode; non-zero exit means block release
          ./target/${{ matrix.target }}/release/archctl doctor --scope storage --json --cwd "$TMP" | tee storage-report.json
          STORAGE_EXIT=${PIPESTATUS[0]}
          # Artifact: upload the JSON report regardless of pass/fail
          echo "storage_exit=$STORAGE_EXIT" >> "$GITHUB_OUTPUT"
          # Upload JSON report as artifact (1-day retention)
          if [ -s storage-report.json ]; then
            echo "Storage probe output captured"
          fi
          # Release gate: block on non-Compatible/Unknown
          if [ "$STORAGE_EXIT" -ne 0 ]; then
            echo "Storage probe failed (exit $STORAGE_EXIT) — release blocked"
            exit 1
          fi
          echo "Storage probe passed"

      - name: Build payload tarball (binary + assets-stack/)
        run: |
          set -euo pipefail
          cd archctl
          mkdir -p staging
          # Copy the binary with the conventional name.
          cp "target/${{ matrix.target }}/release/archctl" staging/archctl
          chmod +x staging/archctl
          # Create the platform-specific tarball.
          case "${{ matrix.os }}" in
            linux)  tar -C staging -czf "../archctl-${{ github.ref_name }}-${{ matrix.label }}.tar.gz" archctl ;;
            macos)  tar -C staging -czf "../archctl-${{ github.ref_name }}-${{ matrix.label }}.tar.gz" archctl ;;
          esac
          ls -lh "../archctl-${{ github.ref_name }}-${{ matrix.label }}.tar.gz"

      - name: Build assets-stack tarball (platform-independent)
        working-directory: archctl
        run: |
          # Bundle assets-stack/ + assets-view/ + Cargo.toml metadata.
          tar -czf "../archctl-assets-${{ github.ref_name }}.tar.gz" \
              assets-stack assets-view
          ls -lh "../archctl-assets-${{ github.ref_name }}.tar.gz"

      - name: Generate migration-manifest.json
        working-directory: archctl
        run: |
          # Determine previous tag for the from_version field.
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p' || echo "")
          cat > migration-manifest.json << EOF
          {
            "from_version": "${PREV_TAG#v}",
            "to_version": "${{ github.ref_name }}",
            "migrations": []
          }
          EOF
          cat migration-manifest.json

      - name: Generate SHA256SUMS
        run: |
          cd ..
          sha256sum \
              archctl-${{ github.ref_name }}-*.tar.gz \
              archctl-assets-${{ github.ref_name }}.tar.gz \
              archctl/migration-manifest.json \
              > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            ../archctl-${{ github.ref_name }}-${{ matrix.label }}.tar.gz
            ../archctl-assets-${{ github.ref_name }}.tar.gz
            ../SHA256SUMS
            archctl/migration-manifest.json

  # ---------------------------------------------------------------------------
  # publish_release: aggregate all builds into a single GitHub Release.
  # ---------------------------------------------------------------------------
  publish_release:
    name: publish GitHub Release
    needs: build_matrix
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p staging
          # Collect all per-platform binaries.
          find artifacts -name "archctl-${{ steps.tag.outputs.name }}-*.tar.gz" -exec cp -t staging {} +
          find artifacts -name "archctl-assets-${{ steps.tag.outputs.name }}.tar.gz" -exec cp -t staging {} +
          find artifacts -name "SHA256SUMS" -exec cp -t staging {} +
          find artifacts -name "migration-manifest.json" -exec cp -t staging {} +
          ls -lh staging/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "${{ steps.tag.outputs.name }}"
          body: |
            ## ${{ steps.tag.outputs.name }}

            Auto-generated by `.github/workflows/release.yml` (M78 — pipeline de release automatizado).

            ### Install

            ```bash
            # Verify the binary:
            curl -fsSL https://github.com/Rubentxu/arch-stack/releases/download/${{ steps.tag.outputs.name }}/SHA256SUMS | \
                grep "${{ steps.tag.outputs.name }}.*linux-x86_64" | sha256sum --check
            # Install via archctl self update:
            archctl self update --to ${{ steps.tag.outputs.name }}
            # Or manually:
            curl -fsSL https://github.com/Rubentxu/arch-stack/releases/download/${{ steps.tag.outputs.name }}/archctl-${{ steps.tag.outputs.name }}-linux-x86_64.tar.gz | tar xz
            sudo mv archctl /usr/local/bin/
            ```

            ### Assets

            | Platform | Asset |
            |---|---|
            | Linux x86_64 | `archctl-${{ steps.tag.outputs.name }}-linux-x86_64.tar.gz` |
            | Linux aarch64 | `archctl-${{ steps.tag.outputs.name }}-linux-aarch64.tar.gz` |
            | macOS x86_64 | `archctl-${{ steps.tag.outputs.name }}-macos-x86_64.tar.gz` |
            | macOS Apple Silicon | `archctl-${{ steps.tag.outputs.name }}-macos-aarch64.tar.gz` |
            | Assets (skills/agents/plugins) | `archctl-assets-${{ steps.tag.outputs.name }}.tar.gz` |
            | Migration manifest | `migration-manifest.json` |

            ### Per ADR-040/041

            - `archctl self update` fetches this release via GitHub Releases API.
            - `archctl self update --check` reports availability.
            - SHA256 verified against `SHA256SUMS` before applying.
            - `migration-manifest.json` documents schema migrations (if any).
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-nightly') || contains(steps.tag.outputs.name, '-alpha') || contains(steps.tag.outputs.name, '-beta') }}
          files: |
            staging/*
          fail_on_unmatched_files: true
          # Pin to the latest commit on the tag (don't move the tag).
          target_commitish: ${{ github.sha }}
