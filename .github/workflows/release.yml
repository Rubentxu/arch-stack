name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Idempotency (spec): a re-push of an existing tag MUST NOT create a
      # duplicate release and MUST log the skip reason.
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ steps.version.outputs.VERSION }}" --repo "${{ github.repository }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Read toolchain channel from rust-toolchain.toml to avoid hardcoding (dup-002 fix).
      - name: Read toolchain channel
        id: toolchain
        run: |
          CHANNEL=$(grep '^channel = ' rust-toolchain.toml | sed 's/channel = "//;s/"$//')
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "${{ steps.toolchain.outputs.channel }}"

      # ADR-033: the release binary embeds the archview workbench and the
      # agent skills/agents/plugin. Build the workbench first, then embed
      # both asset sets, then compile archctl with everything inside.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: archview/pnpm-lock.yaml

      - name: Build archview dist
        working-directory: archview
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Embed workbench + stack assets
        run: |
          ./scripts/embed-view.sh
          ./scripts/embed-stack.sh

      # NOTE (2026-08-06): the static musl build is IMPOSSIBLE with lbug
      # 0.18.3 — its prebuilt liblbug.a (112MB) is glibc and zig/musl-gcc
      # cannot link it (all 10+ release runs failed with exit 101).
      # Release uses glibc (gnu) instead: built on ubuntu-latest, runs on
      # any modern Linux distro. The M27 sandbox container (ubuntu:24.04,
      # glibc) compiles archctl natively in-container for its own runs.
      - name: Build release (embedded workbench + stack)
        working-directory: archctl
        run: cargo build --release

      # CHANGELOG promotion (spec): replace the Unreleased header with the
      # released version + date. Idempotent: skip when already promoted so a
      # re-run does not corrupt the document or fail on an empty commit.
      - name: Promote CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE=$(date '+%Y-%m-%d')
          if grep -q "^## \[v${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG already promoted for v${VERSION}, skipping"
            exit 0
          fi
          sed -i "s/^## \[Unreleased\] — v${VERSION}/## [v${VERSION}] — ${DATE}/" CHANGELOG.md
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): promote to v${VERSION}"

      - name: Create GH Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          files: archctl/target/release/archctl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip (release exists)
        if: steps.check_release.outputs.exists == 'true'
        run: echo "Release v${{ steps.version.outputs.VERSION }} already exists, skipping"
