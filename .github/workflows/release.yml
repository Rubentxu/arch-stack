name: release

# Trigger on every version tag push, or manually via workflow_dispatch
# (the dispatch runs THIS file from the selected branch and checks out the
# input tag for the build — see `env.TAG_NAME` + checkout `ref`).
#
# The workflow:
# 1. Builds archview (workbench) + embeds it and assets-stack.
# 2. Builds the archctl binary on each target in the matrix.
# 3. Runs the ADR-048 storage probe (blocking on linux; macOS degrades).
# 4. Generates SHA256SUMS + migration-manifest.json.
# 5. Creates/updates the GitHub Release with the binary tarballs.
#
# Per ADR-040 (versioned distribution) + ADR-041 (self-update via GitHub
# Releases). Repair history: PR #177 (v1.43.0) broke this workflow
# (dropped archview embed steps, `cd ..` in SHA256SUMS, `..` artifact
# paths rejected by upload-artifact@v4, macos-13 runner retired);
# releases failed from v1.38.0 to v1.69.0 until this repair.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.69.0). Defaults to the latest pushed tag."
        required: false
        type: string

permissions:
  contents: write   # to create releases
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"
  # For tag pushes: github.ref_name is the tag (e.g. v1.69.0).
  # For workflow_dispatch: use the explicit input.
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # build_matrix: build archctl on each (target, os) combination.
  # ---------------------------------------------------------------------------
  build_matrix:
    name: build ${{ matrix.label }}
    # Native runners per target (P0-03): darwin binaries MUST be built on
    # macOS (no cross toolchain for the lbug C++ FFI), aarch64 on ARM.
    # macos-x86_64 builds on macos-14 (Rosetta cross-compile): macos-13 was
    # retired and queue-starved every run.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — primary target, Tier 1 per ADR-040.
          # ubuntu-24.04: gcc 13 provides <format> required by lbug 0.18.3
          # headers on cold-cache builds (gcc 11 on 22.04 fails).
          - label: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            archive: tar.gz
          # Linux aarch64 — Tier 1 (Graviton, Asahi). Native ARM runner.
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            archive: tar.gz
          # macOS Intel — Tier 1 (Rosetta cross-compile on arm64 runner).
          - label: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
            os: macos
            archive: tar.gz
          # macOS Apple Silicon — Tier 1.
          - label: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            os: macos
            archive: tar.gz
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain does not reliably add cross targets on
      # macOS arm64 hosts (E0463 'can't find crate for core' for
      # x86_64-apple-darwin). Ensure it explicitly.
      - name: Ensure target installed
        run: rustup target add ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Must match local dev (v11.9.0): pnpm 9 misreads
          # archview/pnpm-workspace.yaml (allowBuilds-only config) as a
          # workspace root and fails with "packages field missing or empty".
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: archview/pnpm-lock.yaml

      - name: Build archview dist
        working-directory: archview
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # rust-embed assets: archctl/assets-view/ + archctl/assets-stack/ are
      # gitignored; the crate serves a stub workbench without them.
      - name: Embed workbench + stack assets
        run: |
          ./scripts/embed-view.sh
          ./scripts/embed-stack.sh

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: archctl -> Cargo.toml

      - name: Version sync guard (tag == Cargo.toml)
        run: |
          TAG="${{ env.TAG_NAME }}"
          WANT="${TAG#v}"
          grep -q "^version = \"${WANT}\"" archctl/Cargo.toml || {
            echo "version mismatch: tag ${TAG} vs archctl/Cargo.toml (want ${WANT})"
            exit 1
          }
          echo "version sync OK: ${TAG}"

      - name: Build archctl release binary
        working-directory: archctl
        run: |
          cargo build --release --target ${{ matrix.target }} --bin archctl
          ls -lh target/${{ matrix.target }}/release/archctl

      - name: Run storage compatibility probe (ADR-048 Tier-1 gate)
        id: probe
        working-directory: archctl
        # lbug 0.18.3's native macOS library fails the fresh-CRUD probe;
        # the gate must still BLOCK the broken macOS binary, but not the
        # whole release: continue-on-error lets the job skip artifact
        # upload below instead (linux stays blocking).
        continue-on-error: ${{ matrix.os == 'macos' }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          mkdir -p "$TMP/probe-test"
          ./target/${{ matrix.target }}/release/archctl doctor --scope storage --json --cwd "$TMP" | tee storage-report.json
          STORAGE_EXIT=${PIPESTATUS[0]}
          if [ "$STORAGE_EXIT" -ne 0 ]; then
            echo "Storage probe failed (exit $STORAGE_EXIT) — release blocked for ${{ matrix.label }}"
            exit 1
          fi
          echo "Storage probe passed"

      - name: Build payload tarball (binary + assets-stack/)
        if: ${{ steps.probe.outcome != 'failure' }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp "archctl/target/${{ matrix.target }}/release/archctl" staging/archctl
          chmod +x staging/archctl
          tar -C staging -czf "dist/archctl-${{ env.TAG_NAME }}-${{ matrix.label }}.tar.gz" archctl
          ls -lh "dist/archctl-${{ env.TAG_NAME }}-${{ matrix.label }}.tar.gz"

      - name: Build assets-stack tarball (platform-independent)
        if: ${{ steps.probe.outcome != 'failure' }}
        run: |
          # Bundle assets-stack/ + assets-view/ + metadata.
          tar -C archctl -czf "dist/archctl-assets-${{ env.TAG_NAME }}.tar.gz" \
              assets-stack assets-view
          ls -lh "dist/archctl-assets-${{ env.TAG_NAME }}.tar.gz"

      - name: Generate migration-manifest.json
        if: ${{ steps.probe.outcome != 'failure' }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p' || echo "")
          cat > dist/migration-manifest.json << EOF
          {
            "from_version": "${PREV_TAG#v}",
            "to_version": "${{ env.TAG_NAME }}",
            "migrations": []
          }
          EOF
          cat dist/migration-manifest.json

      - name: Generate SHA256SUMS
        if: ${{ steps.probe.outcome != 'failure' }}
        run: |
          cd dist
          sha256sum \
              archctl-${{ env.TAG_NAME }}-*.tar.gz \
              archctl-assets-${{ env.TAG_NAME }}.tar.gz \
              migration-manifest.json \
              > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        if: ${{ steps.probe.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/archctl-${{ env.TAG_NAME }}-${{ matrix.label }}.tar.gz
            dist/archctl-assets-${{ env.TAG_NAME }}.tar.gz
            dist/SHA256SUMS
            dist/migration-manifest.json

  # ---------------------------------------------------------------------------
  # publish_release: aggregate all builds into a single GitHub Release.
  # ---------------------------------------------------------------------------
  publish_release:
    name: publish GitHub Release
    needs: build_matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p staging
          find artifacts -name "archctl-${{ env.TAG_NAME }}-*.tar.gz" -exec cp -t staging {} +
          find artifacts -name "archctl-assets-${{ env.TAG_NAME }}.tar.gz" -exec cp -t staging {} +
          find artifacts -name "SHA256SUMS" -exec cp -t staging {} +
          find artifacts -name "migration-manifest.json" -exec cp -t staging {} +
          ls -lh staging/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.TAG_NAME }}"
          body: |
            ## ${{ env.TAG_NAME }}

            Auto-generated by `.github/workflows/release.yml`.

            ### Install

            ```bash
            # Verify the binary:
            curl -fsSL https://github.com/Rubentxu/arch-stack/releases/download/${{ env.TAG_NAME }}/SHA256SUMS | \
                grep "${{ env.TAG_NAME }}.*linux-x86_64" | sha256sum --check
            # Install via archctl self update:
            archctl self update --to ${{ env.TAG_NAME }}
            # Or manually:
            curl -fsSL https://github.com/Rubentxu/arch-stack/releases/download/${{ env.TAG_NAME }}/archctl-${{ env.TAG_NAME }}-linux-x86_64.tar.gz | tar xz
            sudo mv archctl /usr/local/bin/
            ```

            ### Assets

            | Platform | Asset |
            |---|---|
            | Linux x86_64 | `archctl-${{ env.TAG_NAME }}-linux-x86_64.tar.gz` |
            | Linux aarch64 | `archctl-${{ env.TAG_NAME }}-linux-aarch64.tar.gz` |
            | macOS x86_64 | `archctl-${{ env.TAG_NAME }}-macos-x86_64.tar.gz` (absent when the ADR-048 probe fails) |
            | macOS Apple Silicon | `archctl-${{ env.TAG_NAME }}-macos-aarch64.tar.gz` (absent when the ADR-048 probe fails) |
            | Assets (skills/agents/plugins) | `archctl-assets-${{ env.TAG_NAME }}.tar.gz` |
            | Migration manifest | `migration-manifest.json` |

            ### Per ADR-040/041

            - `archctl self update` fetches this release via GitHub Releases API.
            - `archctl self update --check` reports availability.
            - SHA256 verified against `SHA256SUMS` before applying.
            - `migration-manifest.json` documents schema migrations (if any).
          draft: false
          prerelease: ${{ contains(env.TAG_NAME, '-rc') || contains(env.TAG_NAME, '-nightly') || contains(env.TAG_NAME, '-alpha') || contains(env.TAG_NAME, '-beta') }}
          files: |
            staging/*
          fail_on_unmatched_files: false
          target_commitish: ${{ env.TAG_NAME }}
