name: PR Checks

# Pre-merge fast gate (ADR-047): deterministic checks on every PR.
# Benchmarks and web build remain post-merge only in ci.yml.
# Target: median < 10 min.
on:
  pull_request:
    branches: [main]

jobs:
  fast-checks:
    name: archctl (build/test/clippy/fmt/doctor/gates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archctl
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archctl/target
          key: cargo-pr-${{ runner.os }}-${{ hashFiles('archctl/Cargo.lock') }}
          restore-keys: cargo-pr-${{ runner.os }}-

      - name: Resolve pinned toolchain
        run: rustup show active-toolchain

      # Bootstrap rust-embed assets (ADR-033). archctl/assets-stack/ is
      # gitignored; without this step the build fails with E0599 on
      # RustEmbed (same gap M33 fixed for the pre-push hook).
      - name: Bootstrap assets-stack
        working-directory: ${{ github.workspace }}
        run: scripts/embed-stack.sh

      - name: Build
        run: cargo build --quiet

      - name: Test
        run: cargo test --quiet

      - name: Clippy
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Doctor (repo-root cwd)
        run: |
          cargo build --quiet --release
          ./target/release/archctl doctor --scopes code --cwd ..

      - name: Doctor Storage Scope (P0-ladybug-doctor)
        run: |
          ./target/release/archctl doctor --scope storage --cwd ..

      - name: Script gates (CI checks + ADR integrity)
        working-directory: ${{ github.workspace }}
        run: scripts/test-ci-gates.sh

  version-sync:
    name: Version sync guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archctl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Cargo version
        id: cargo_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "cargo_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest git tag
        id: git_tag
        run: |
          TAG=$(git tag --sort=-creatordate | head -1 | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "git_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check version match
        run: |
          if [ "${{ steps.cargo_version.outputs.cargo_version }}" != "${{ steps.git_tag.outputs.git_tag }}" ]; then
            echo "ERROR: CARGO_PKG_VERSION (${{ steps.cargo_version.outputs.cargo_version }}) != latest git tag (${{ steps.git_tag.outputs.git_tag }})"
            exit 1
          fi
